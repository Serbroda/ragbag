spring:
  application:
    name: ragbag-server

  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
  # Comma-separated list, e.g. ACTUATOR_API_KEYS=$(openssl rand -base64 32)
  api-keys: ${ACTUATOR_API_KEYS:}
