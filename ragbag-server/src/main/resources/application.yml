server:
  # Behind a reverse proxy (nginx proxy manager, Traefik, Caddy, ...) use the X-Forwarded-Proto/-Host headers
  # to know the public URL. Without this, the browser's Origin (https://ragbag.example.com) does not match
  # the internal address and same-origin requests are rejected as cross-origin. Only proxies from private
  # networks are trusted (server.tomcat.remoteip.internal-proxies to change).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Spelled out: without them Tomcat ignores the scheme (https) the proxy reports
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

spring:
  application:
    name: ragbag-server

  jpa:
    # Controllers still map lazy associations (e.g. bookmark tags); disable once mapping moves into services
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Avatars and space icons; they are scaled down to 256 px before being stored
      max-file-size: 5MB
      max-request-size: 6MB

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  #packages-to-scan: de.serbroda.ragbag.generated
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger-ui

security:
  jwt:
    issuer: ragbag
    secret: "CHANGE_ME_TO_A_VERY_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS" # openssl rand -base64 32
    # Force the Secure flag on the refresh cookie. Without it the flag is set automatically for HTTPS
    # requests, including those a reverse proxy terminates (X-Forwarded-Proto: https)
    secure-cookie: false
    expiration:
      accessToken: 15 # minutes
      refreshToken: 20160 # minutes (14 days)
  api-keys:
    - qixG+XyASUrmrSae1vuMbpe4UjfVaYplU2E3LrqML3Q= # openssl rand -base64 32

app:
  cors:
    # Origins of frontends served from somewhere else than this server (the Vite dev server by default).
    # Not needed behind a reverse proxy that serves /app and /api under the same domain.
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
      - http://localhost:5173
  features:
    # Enable or disable the registration endpoint
    registration-enabled: true
  metadata:
    # Allow fetching link titles from private networks (10.x, 192.168.x, ...), e.g. for homelab dashboards.
    # Loopback and link-local addresses (cloud metadata endpoints) are always refused.
    allow-private-hosts: false
