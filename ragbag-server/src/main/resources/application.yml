spring:
  application:
    name: ragbag-server

  jpa:
    # Controllers still map lazy associations (e.g. bookmark tags); disable once mapping moves into services
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Avatars and space icons; they are scaled down to 256 px before being stored
      max-file-size: 5MB
      max-request-size: 6MB

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  #packages-to-scan: de.serbroda.ragbag.generated
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger-ui

security:
  jwt:
    issuer: ragbag
    secret: "CHANGE_ME_TO_A_VERY_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS" # openssl rand -base64 32
    secure-cookie: false
    expiration:
      accessToken: 15 # minutes
      refreshToken: 20160 # minutes (14 days)
  api-keys:
    - qixG+XyASUrmrSae1vuMbpe4UjfVaYplU2E3LrqML3Q= # openssl rand -base64 32

app:
  features:
    # Enable or disable the registration endpoint
    registration-enabled: true
  metadata:
    # Allow fetching link titles from private networks (10.x, 192.168.x, ...), e.g. for homelab dashboards.
    # Loopback and link-local addresses (cloud metadata endpoints) are always refused.
    allow-private-hosts: false
