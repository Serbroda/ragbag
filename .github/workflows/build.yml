name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('ragbag-frontend/package-lock.json') }}

      # Generates both SDKs, builds the frontend, runs server tests and spotless:check
      - name: Build
        run: ./mvnw -B clean verify

      - name: Frontend type check
        working-directory: ragbag-frontend
        run: npm run check
