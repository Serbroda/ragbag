name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/v1/package-lock.json

      - name: Generated code is up to date
        run: go generate ./internal/api && git diff --exit-code internal/api

      - name: Build
        run: make build

      - name: Lint and type check
        run: make check

      - name: Test (SQLite)
        run: go test ./...

      - name: Test (PostgreSQL)
        run: go test -count=1 ./internal/server/...
        env:
          RAGBAG_TEST_POSTGRES: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
