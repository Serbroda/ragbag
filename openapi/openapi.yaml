openapi: 3.1.0
info:
  title: Authentication Api
  version: 1.0.0

paths:
  # App
  /app/config/features:
    get:
      summary: App Feature Flags
      operationId: featureFlags
      tags:
        - App
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlags'

  /health:
    get:
      summary: For monitoring (public); 503 when the database does not answer
      operationId: health
      tags:
        - App
      security: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
        '503':
          description: The database does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'

  /app/legal/{page}:
    get:
      summary: A legal page (imprint, privacy policy, terms of use) from DATA_DIR/legal, rendered from Markdown
      operationId: getLegalPage
      tags:
        - App
      security: [ ]
      parameters:
        - in: path
          name: page
          required: true
          schema:
            type: string
            enum: [ imprint, privacy, terms ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalPageDto'
        '404':
          $ref: '#/components/responses/NotFound'

  # Authentication
  /auth/register:
    post:
      summary: >
        Register a new user. When the server sends email (feature flag "email"), the account must confirm its
        address with the link sent to it before it can sign in.
      operationId: register
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/invites/{token}:
    get:
      summary: >
        Preview an invite without being signed in; registration says whether it can be used to create an
        account (registration enabled, or an invite of an instance admin)
      operationId: getRegistrationInvite
      tags:
        - Authentication
      security: [ ]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreviewDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/login:
    post:
      summary: Login
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie:
              description: >
                HttpOnly refresh token cookie.
                Path=/api/auth/refresh; SameSite=Lax; Secure (in prod).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The email address is not confirmed yet; a new confirmation link was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/verify-email/{token}:
    post:
      summary: Confirm the email address of a new account with the link from the email (public); signs in
      operationId: verifyEmail
      tags:
        - Authentication
      security: [ ]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK, with the refresh token cookie like a login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: refresh
      description: >
        Uses the HttpOnly refresh_token cookie to issue a new access token.
      tags:
        - Authentication
      parameters:
        - in: cookie
          name: refresh_token
          description: Missing when signed out; the server then answers 401
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Logout on this device (clears the refresh token cookie)
      operationId: logout
      tags:
        - Authentication
      responses:
        '204':
          $ref: '#/components/responses/NoContent'

  /auth/logout/all:
    get:
      summary: Logout from all devices
      operationId: logoutAll
      tags:
        - Authentication
      security:
        - bearerAuth: [ ]
      responses:
        '203':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password:
    post:
      summary: Change the own password; signs out all other devices and returns new tokens for this one
      operationId: changePassword
      tags:
        - Authentication
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: OK, a new refresh token cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/setup:
    post:
      summary: >
        Replace the random initial password of the setup admin (created on the first start of an empty instance)
        and set its email address; returns new tokens
      operationId: completeSetup
      tags:
        - Authentication
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSetupRequest'
      responses:
        '200':
          description: OK, a new refresh token cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/password-reset:
    post:
      summary: >
        Send a password reset link to the account's email address (public, only when the server sends email).
        Answers 204 whether the account exists or not.
      operationId: requestPasswordReset
      tags:
        - Authentication
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password-reset/{token}:
    get:
      summary: Check a password reset link (public)
      operationId: getPasswordReset
      tags:
        - Authentication
      security: [ ]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetPreviewDto'
    post:
      summary: Set a new password with a reset link (public); signs out all devices of the user
      operationId: resetPassword
      tags:
        - Authentication
      security: [ ]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'

  # Instance administration (users listed in app.admin-users / ADMIN_USERS)
  /v1/admin/users:
    get:
      summary: All users of this installation
      operationId: getAllUsers
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/users/{userId}/password-reset:
    post:
      summary: Create a one-time password reset link for a user (replaces an older one)
      operationId: createPasswordReset
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/users/{userId}:
    delete:
      summary: >
        Delete an account like it deletes itself; spaces it is the last owner of go to the next member (highest
        role, longest membership), spaces without other members are deleted
      operationId: deleteUser
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/users/{userId}/block:
    put:
      summary: Block an account; it is signed out, cannot sign in and its public links stop working
      operationId: blockUser
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Unblock an account
      operationId: unblockUser
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/users/{userId}/pro:
    put:
      summary: Make an account Pro (PLANS_ENABLED)
      operationId: grantPro
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Take back Pro granted by an admin
      operationId: revokePro
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/reports:
    get:
      summary: Reports of public links, open ones first
      operationId: getReports
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbuseReportDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/reports/{reportId}/resolve:
    post:
      summary: >
        Decide on a report: disable the reported public link, dismiss the report, or enable a disabled link again.
        The reporter and (for links) the one who shared it are told by email with the note
      operationId: resolveReport
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbuseReportDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/overview:
    get:
      summary: What the admin page shows first (version, database, counts and the effective configuration)
      operationId: getAdminOverview
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/instance:
    get:
      summary: State of the installation (whether a backup can be restored)
      operationId: getInstance
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/backup:
    get:
      summary: >
        Backup of the whole installation (format "ragbag-instance", gzip compressed JSON): accounts with their
        password hashes, spaces, links, images, everything except pending reset and confirmation links
      operationId: downloadBackup
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The backup file
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/backups:
    get:
      summary: The backups the server made itself (BACKUP_KEEP), newest first, with the schedule
      operationId: getBackups
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Make a backup into the backup directory now (older ones beyond BACKUP_KEEP are deleted)
      operationId: createBackup
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/backups/{name}:
    get:
      summary: Download one of the stored backups
      operationId: downloadStoredBackup
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The backup file
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/backup/restore:
    post:
      summary: >
        Replace the data of an empty installation (no spaces, no accounts but the setup admin) with a backup.
        Signs out the caller, whose account is replaced too
      operationId: restoreBackup
      tags:
        - Admin
      security:
        - bearerAuth: [ ]
      parameters:
        - in: query
          name: dryRun
          description: Only check the backup and report what it holds, without changing anything
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupSummaryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # Users
  /v1/users/me:
    get:
      summary: Get current user
      operationId: me
      tags:
        - User
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/users/me/plan:
    get:
      summary: The own plan (PLANS_ENABLED) with usage and the limits of Free and Pro
      operationId: getPlan
      tags:
        - Plan
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/users/me/delete:
    post:
      summary: >
        Delete the own account (needs the password). Spaces without other members are deleted with it; owning a
        space with other members and no other owner answers 409 with the spaces in the detail
      operationId: deleteAccount
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/users/me/start-space:
    put:
      summary: The space to open on start; null opens the last visited one
      operationId: setStartSpace
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSpaceDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/users/me/display-name:
    put:
      summary: Set the display name, shown instead of the username; empty removes it
      operationId: setDisplayName
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisplayNameDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/users/me/pin:
    put:
      summary: Set or change the PIN that unlocks the user's locked collections (needs the account password)
      operationId: setPin
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinDto'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/users/me/unlock:
    post:
      summary: >
        Unlock the user's locked collections with the PIN. The token goes into the X-Ragbag-Unlock header of
        later requests and expires after a few minutes unless renewed.
      operationId: unlock
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many wrong PINs, try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/users/me/unlock/renew:
    post:
      summary: Extend a valid unlock (sent in X-Ragbag-Unlock) while the user is active
      operationId: renewUnlock
      tags:
        - User
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/users/me/space-bar:
    get:
      summary: Personal order and folders of the space bar
      operationId: getSpaceBar
      tags:
        - User
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceBarDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Save the personal order and folders of the space bar
      operationId: updateSpaceBar
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceBarDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceBarDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/users/me/avatar:
    put:
