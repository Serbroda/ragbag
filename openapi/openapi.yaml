        - Collection
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: collectionId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: The export file (format "ragbag-collection", see CollectionExchange on the server)
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/collections/{collectionId}/import:
    post:
      summary: Import an export file into a collection; sub-collections with the same name are merged
      description: |
        Takes a Ragbag export (JSON) or, as `text/html`, the bookmarks file browsers and most bookmark services
        export ("Netscape bookmark file"): its folders become sub-collections.
      operationId: importCollection
      tags:
        - Collection
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: collectionId
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - in: query
          name: preview
          description: Only report what the import would do, without changing anything
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
          text/html:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

