components:
  schemas:
    ID:
      type: string
      description: UUID
      example: "fa2b6a4a-5403-498c-9be8-c31d7d01a724"
      minLength: 36
      maxLength: 36

    JWT:
      type: string
      description: JSON Web Token
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdW..."

    Error:
      type: object
      properties:
        message:
          type: string

    FeatureFlags:
      type: object
      additionalProperties:
        type: string

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        access_token:
          $ref: '#/components/schemas/JWT'
      required:
        - access_token

    RequestPasswordResetRequest:
      type: object
      properties:
        login:
          type: string
          description: Username or email address
      required:
        - login

    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
      required:
        - newPassword

    PasswordResetPreviewDto:
      type: object
      properties:
        valid:
          type: boolean
          description: False if the link is unknown, expired or already used
        username:
          type: string
      required:
        - valid

    PlanName:
      type: string
      enum: [ FREE, PRO ]

    ProSource:
      description: Why an account is Pro
      type: string
      enum: [ ADMIN, GRANTED ]

    QuotasDto:
      description: Limits, 0 is unlimited
      type: object
      properties:
        linksPerUser:
          type: integer
        spacesPerUser:
          type: integer
        collectionsPerSpace:
          type: integer
        uploadMbPerUser:
          type: integer
      required:
        - linksPerUser
        - spacesPerUser
        - collectionsPerSpace
        - uploadMbPerUser

    PlanUsageDto:
      description: What counts against the limits
      type: object
      properties:
        links:
          type: integer
        spaces:
          type: integer
          description: Spaces the user owns
        uploadBytes:
          type: integer
          format: int64
      required:
        - links
        - spaces
        - uploadBytes

    PlanDto:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/PlanName'
        proSource:
          $ref: '#/components/schemas/ProSource'
        usage:
          $ref: '#/components/schemas/PlanUsageDto'
        free:
          $ref: '#/components/schemas/QuotasDto'
        pro:
          $ref: '#/components/schemas/QuotasDto'
      required:
        - plan
        - usage
        - free
        - pro

    PasswordResetDto:
      type: object
      properties:
        token:
          type: string
          description: Only returned once; the server keeps a hash
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt

    AdminUserDto:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        displayName:
          type: string
          description: Shown instead of the username where set (not unique)
        email:
          type: string
        avatarId:
          $ref: '#/components/schemas/ID'
        instanceAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        spaces:
          type: integer
          description: Number of spaces the user is a member of
        blockedAt:
          type: string
          format: date-time
          description: Blocked by an instance admin since then
        blockedReason:
          type: string
        plan:
          $ref: '#/components/schemas/PlanName'
          description: Only with PLANS_ENABLED
        proSource:
          $ref: '#/components/schemas/ProSource'
      required:
        - id
        - username
        - email
        - instanceAdmin

    AdminOverviewDto:
      type: object
      properties:
        version:
          type: string
        database:
          type: string
          enum: [ sqlite, postgres ]
        schemaVersion:
          type: integer
          format: int64
        users:
          type: integer
        blockedUsers:
          type: integer
        unconfirmedUsers:
          type: integer
          description: Accounts waiting for their email address to be confirmed
        spaces:
          type: integer
        collections:
          type: integer
        bookmarks:
          type: integer
          description: Links, trashed ones included
        publicLinks:
          type: integer
        imageBytes:
          type: integer
          format: int64
          description: Size of all stored images
        openReports:
          type: integer
        grantedPro:
          type: integer
          description: Accounts an admin made Pro
        settings:
          $ref: '#/components/schemas/AdminSettingsDto'
      required:
        - version
        - database
        - schemaVersion
        - users
        - blockedUsers
        - unconfirmedUsers
        - spaces
        - collections
        - bookmarks
        - publicLinks
        - imageBytes
        - openReports
        - settings

    AdminSettingsDto:
      description: The configuration in effect (environment variables), read-only
      type: object
      properties:
        publicUrl:
          type: string
        registrationOpen:
          type: boolean
        email:
          type: boolean
          description: SMTP_HOST is set
        rateLimits:
          type: boolean
        allowPrivateHosts:
          type: boolean
        adminUsers:
          type: array
          items:
            type: string
          description: ADMIN_USERS; empty means the setup admin
        quotaLinksPerUser:
          type: integer
          description: 0 is unlimited
        quotaSpacesPerUser:
          type: integer
        quotaCollectionsPerSpace:
          type: integer
        quotaUploadMbPerUser:
          type: integer
        legalImprint:
          type: string
          description: Where the imprint is (an address or /app/legal/imprint), empty without one
        legalPrivacy:
          type: string
        legalTerms:
          type: string
        backupKeep:
          type: integer
          description: BACKUP_KEEP, 0 when the server makes no backups itself
        lastBackupAt:
          type: string
          format: date-time
        logAnonymizeIp:
          type: boolean
        logFile:
          type: string
          description: LOG_FILE, empty for stdout
        logMaxAgeDays:
          type: integer
        plans:
          type: boolean
          description: PLANS_ENABLED; the QUOTA_* are then those of the Free plan
        supportUrl:
          type: string
          description: SUPPORT_URL, the donation page linked in the app; empty without one
        proQuotas:
          $ref: '#/components/schemas/QuotasDto'
      required:
        - publicUrl
        - registrationOpen
        - email
        - rateLimits
        - allowPrivateHosts
        - adminUsers
        - quotaLinksPerUser
        - quotaSpacesPerUser
        - quotaCollectionsPerSpace
        - quotaUploadMbPerUser

    BlockUserRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Told to the user (login and email)

    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
      required:
        - password

    ReportCategory:
      type: string
      enum: [ ILLEGAL, CHILD_SAFETY, COPYRIGHT, PERSONAL_DATA, SPAM, OTHER ]

    CreateReportRequest:
      type: object
      properties:
        collectionId:
          $ref: '#/components/schemas/ID'
          description: The sub-collection shown when reporting; the shared collection if omitted
        category:
          $ref: '#/components/schemas/ReportCategory'
        details:
          type: string
          minLength: 10
          maxLength: 5000
          description: What is wrong and where, e.g. which link and why it is illegal
        name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 250
          description: For the confirmation and the decision
        goodFaith:
          type: boolean
          description: The reporter confirms that the report is accurate and complete to the best of their knowledge
      required:
        - category
        - details
        - goodFaith

    ResolveReportRequest:
      type: object
      properties:
        action:
          type: string
          enum: [ DISABLE_LINK, DISMISS, ENABLE_LINK ]
        note:
          type: string
          maxLength: 2000
          description: The reasons, sent to the reporter and (for links) the one who shared it
      required:
        - action

    AbuseReportDto:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        category:
          $ref: '#/components/schemas/ReportCategory'
        details:
          type: string
        reporterName:
          type: string
        reporterEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        collectionId:
          $ref: '#/components/schemas/ID'
          description: Unset once the collection was deleted
        viewedCollectionId:
          $ref: '#/components/schemas/ID'
          description: The (sub-)collection shown when reporting
        collectionName:
          type: string
          description: The path of the reported collection when reporting, e.g. "Recipes / Cakes"
        spaceName:
          type: string
        shareToken:
          type: string
          description: The token of the reported link (/app/share/{token})
        currentToken:
          type: string
          description: The collection's current link, if it still has one
        sharedBy:
          type: string
          description: The display name (else the username) of who created the current link
        sharedById:
          $ref: '#/components/schemas/ID'
        linkDisabled:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
        resolution:
          type: string
          enum: [ DISABLE_LINK, DISMISS, ENABLE_LINK ]
        resolutionNote:
          type: string
      required:
        - id
        - category
        - details
        - createdAt
        - collectionName
        - shareToken
        - linkDisabled

    CompleteSetupRequest:
      type: object
      properties:
        currentPassword:
          type: string
          description: The initial password from the file
        newPassword:
          type: string
          minLength: 8
        email:
          type: string
      required:
        - currentPassword
        - newPassword
        - email

    InstanceDto:
      type: object
      properties:
        empty:
          type: boolean
          description: No spaces and no accounts besides the setup admin, so a backup can be restored
      required:
        - empty

    BackupSummaryDto:
      type: object
      properties:
        appVersion:
          type: string
          description: The version of Ragbag that made the backup
        schemaVersion:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        rows:
          type: object
          description: Rows per table
          additionalProperties:
            type: integer
        admins:
          type: array
          items:
            type: string
          description: The restored accounts that will be instance admins (ADMIN_USERS, or the backup's setup admin)
        usernames:
          type: array
          items:
            type: string
          description: The first restored accounts by name (at most 20)
      required:
        - appVersion
        - schemaVersion
        - createdAt
        - rows
        - admins
        - usernames

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        acceptTerms:
          type: boolean
          description: Required when the instance has terms of use (legal_terms in the feature flags)
        displayName:
          type: string
          description: Optional, 1 to 50 characters; shown instead of the username
        inviteToken:
          type: string
          description: >
            A space invite: the new account joins that space (with email once it is confirmed). While
            registration is disabled only invites of instance admins allow registering.
      required:
        - username
        - email
        - password

    HealthDto:
      type: object
      properties:
        status:
          type: string
          enum: [ ok, unavailable ]
        version:
          type: string
      required:
        - status
        - version

    BackupsDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: BACKUP_KEEP is above 0
        keep:
          type: integer
        intervalHours:
          type: integer
        dir:
          type: string
        nextAt:
          type: string
          format: date-time
          description: When the next scheduled backup is due (enabled only)
        files:
          type: array
          items:
            $ref: '#/components/schemas/BackupFileDto'
      required:
        - enabled
        - keep
        - intervalHours
        - dir
        - files

    BackupFileDto:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
      required:
        - name
        - size
        - createdAt

    LegalPageDto:
      type: object
      properties:
        page:
          type: string
        title:
          type: string
        html:
          type: string
          description: Rendered Markdown; raw HTML in the file is not passed through
      required:
        - page
        - title
        - html

    UserDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        displayName:
          type: string
          description: Shown instead of the username where set (not unique)
        email:
          type: string
        avatarId:
          $ref: '#/components/schemas/ID'
        instanceAdmin:
          type: boolean
          description: >
            Listed in ADMIN_USERS (or the setup admin while it is empty), may manage all users of this
            installation
        hasPin:
          type: boolean
          description: Has a PIN to unlock locked collections
        startSpaceId:
          $ref: '#/components/schemas/ID'
          description: Opened on start instead of the last visited space; unset when the user leaves it
        mustChangePassword:
          type: boolean
          description: The setup admin still has its random initial password; everything else answers 403
        openReports:
          type: integer
          description: Unresolved reports of public links (instance admins only)
      required:
        - id
        - username
        - email

    DisplayNameDto:
      properties:
        displayName:
          type: string
          description: 1 to 50 characters, any case, spaces and emojis; empty or left out removes it

    StartSpaceDto:
      properties:
        spaceId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: A space the user is a member of, or null for the last visited one

    SetPinDto:
      properties:
        currentPassword:
          type: string
        pin:
          type: string
          description: 4 to 8 digits
      required:
        - currentPassword
        - pin

    UnlockRequest:
      properties:
        pin:
          type: string
      required:
        - pin

    UnlockDto:
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt

    SpaceDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        iconId:
          $ref: '#/components/schemas/ID'
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SpacePermissionEnum'
        discoverable:
          type: boolean
          description: Listed for every account of the instance, which can join without an invite
        joinRole:
          $ref: '#/components/schemas/JoinRoleEnum'
        newCount:
          type: integer
          description: Links other members added since the current user last looked; only set in the space list
        welcomeMessage:
          type: string
          description: Markdown shown to members when they first open the space
        welcomeHtml:
          type: string
          description: The welcome message rendered as HTML (no raw HTML from the Markdown)
        welcomed:
          type: boolean
          description: False until the current user saw the welcome of the space (POST /spaces/{id}/welcomed)
      required:
        - id
        - name

    DiscoverableSpaceDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        iconId:
          $ref: '#/components/schemas/ID'
        memberCount:
          type: integer
        joinRole:
          $ref: '#/components/schemas/JoinRoleEnum'
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
      required:
        - id
        - name
        - memberCount
        - joinRole

    JoinRoleEnum:
      type: string
      description: Role of people joining a discoverable space
      enum:
        - CONTRIBUTOR
        - VIEWER

    CreateSpaceDto:
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
      required:
        - name

    SpaceMemberRoleEnum:
      type: string
      enum:
        - OWNER
        - ADMIN
        - CONTRIBUTOR
        - VIEWER

    InviteRoleEnum:
      type: string
      description: Roles that can be handed out via invite links
      enum:
        - ADMIN
        - CONTRIBUTOR
        - VIEWER

    SpaceMemberDto:
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        displayName:
          type: string
          description: Shown instead of the username where set (not unique)
        avatarId:
          $ref: '#/components/schemas/ID'
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
      required:
        - userId
        - username
        - role

    UpdateSpaceMemberDto:
      properties:
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
      required:
        - role

    InvitePreviewDto:
      properties:
        targetType:
          type: string
          enum: [ SPACE, COLLECTION ]
        targetId:
          $ref: '#/components/schemas/ID'
        targetName:
          type: string
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        invitedBy:
          type: string
        valid:
          type: boolean
          description: False if the invite is expired or used up
        alreadyMember:
          type: boolean
        registration:
          type: boolean
          description: Whether a new account can be created with this invite (only in the signed-out preview)
      required:
        - targetType
        - targetId
        - valid
        - alreadyMember

    SpacePermissionEnum:
      type: string
      enum:
        - READ # Permission to read space details and collections
        - EDIT_SPACE # Permission to edit space details (name, description)
        - CREATE_COLLECTIONS # Permission to create collections within the space
        - EDIT_COLLECTIONS # Permission to create and manage collections within the space
        - DELETE_COLLECTIONS # Permission to delete collections within the space
        - CREATE_BOOKMARKS # Permission to create bookmarks within the space
        - EDIT_BOOKMARKS # Permission to create and manage bookmarks within the space
        - DELETE_BOOKMARKS # Permission to delete bookmarks within the space
        - DELETE_SPACE # Permission to delete the space
        - MANAGE_MEMBERS # Permission to change member roles, remove members and manage invites
        - IMPORT_EXPORT # Permission to export collections and import export files

    UpdateSpaceDto:
      properties:
        name:
          type: string
        description:
          type: string
        discoverable:
          type: boolean
          description: Unchanged when left out; changing it needs MANAGE_MEMBERS
        joinRole:
          $ref: '#/components/schemas/JoinRoleEnum'
        welcomeMessage:
          type: string
          description: Markdown, at most 10000 characters; unchanged when left out, empty removes it
      required:
        - name

    SpaceDtoList:
      type: array
      items:
        $ref: '#/components/schemas/SpaceDto'

    CollectionDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        parentId:
          $ref: '#/components/schemas/ID'
        restricted:
          type: boolean
          description: Only the members listed in the collection's access can see it (and everything inside)
        children:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDto'
        bookmarkCount:
          type: integer
          description: Links directly in this collection; only set in the collection tree
        newCount:
          type: integer
          description: Links directly in this collection that are new for the current user; only set in the tree
        shared:
          type: boolean
          description: Has a public read-only link
        locked:
          type: boolean
          description: Locked by the current user (only listed while unlocked); sub-collections inherit it
        query:
          type: string
          description: |
            Set for smart collections: they hold neither links nor sub-collections, listing their bookmarks
            returns what this search finds in the whole space (like the search, for the current user)
      required:
        - id
        - name

    CollectionVisibilityDto:
      type: string
      enum:
        - PRIVATE
        - INTERNAL
        - PUBLIC

    CollectionDtoList:
      type: array
      items:
        $ref: '#/components/schemas/CollectionDto'

    CreateCollectionDto:
      properties:
        name:
          type: string
        parentId:
          $ref: '#/components/schemas/ID'
        restricted:
          type: boolean
          description: Create the collection as private; the creator always has access
        memberIds:
          type: array
          description: Further space members who may see a private collection
          items:
            $ref: '#/components/schemas/ID'
        query:
          type: string
          description: Creates a smart collection showing the results of this search (at most 200 characters)
      required:
        - name

    CollectionAccessDto:
      properties:
        restricted:
          type: boolean
        members:
          type: array
          description: Members who can see the collection (empty unless restricted)
          items:
            $ref: '#/components/schemas/CollectionAccessMemberDto'
        canManage:
          type: boolean
          description: Whether the current user may change who can see the collection
      required:
        - restricted
        - members
        - canManage

    CollectionAccessMemberDto:
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        displayName:
          type: string
          description: Shown instead of the username where set (not unique)
        avatarId:
          $ref: '#/components/schemas/ID'
      required:
        - userId
        - username

    UpdateCollectionAccessDto:
      properties:
        restricted:
          type: boolean
        memberIds:
          type: array
          description: Space members who may see the private collection; the current user is always kept
          items:
            $ref: '#/components/schemas/ID'
      required:
        - restricted

    ImportResultDto:
      description: What an import did, or as preview would do
      properties:
        preview:
          type: boolean
        formatVersion:
          type: integer
        appVersion:
          type: string
          description: Ragbag version that exported the file, none for the bookmarks file of a browser
        collectionsCreated:
          type: integer
        collectionsMerged:
          type: integer
          description: Sub-collections of the file that already existed under the same name
        bookmarksImported:
          type: integer
        bookmarksSkipped:
          type: integer
          description: Links already in the target collection
        bookmarksInvalid:
          type: integer
          description: Links without a valid http(s) URL
      required:
        - preview
        - formatVersion
        - collectionsCreated
        - collectionsMerged
        - bookmarksImported
        - bookmarksSkipped
        - bookmarksInvalid

    ImageUpload:
      type: object
      description: Either an image file (PNG, JPEG, GIF or WebP) or the URL of one
      properties:
        file:
          type: string
          format: binary
        url:
          type: string

    UpdateCollectionDto:
      properties:
        name:
          type: string
        description:
          type: string
          description: Omitted keeps the description, an empty string removes it
        query:
          type: string
          description: New search of a smart collection; omitted keeps it, other collections answer 400
      required:
        - name

    MoveCollectionDto:
      type: object
      properties:
        parentId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: Target parent collection ID, or null to move to root
        beforeId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: >
            A collection below the target parent to place it in front of; without one it goes to the end. The
            order is the same for every member of the space.

    BookmarkDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        collectionId:
          $ref: '#/components/schemas/ID'
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        ogImage:
          type: string
        favicon:
          type: string
        canonical:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Display name (else username) of the member who added the bookmark
        favorite:
          type: boolean
          description: Whether the current user marked this bookmark as favorite
        customImageId:
          $ref: '#/components/schemas/ID'
          description: An uploaded preview image (/api/v1/images/{id}); wins over everything else
        customImageUrl:
          type: string
          description: An own preview image address, loaded from there; wins over ogImage
        imageHidden:
          type: boolean
          description: Show no preview image at all
        feedUrl:
          type: string
          description: News feed (RSS or Atom) whose latest headlines the card shows
        feedFilter:
          type: string
          description: Comma separated words; only headlines containing one of them are shown
        isNew:
          type: boolean
          description: >
            Added by another member since the current user last looked at the collection; only set when listing
            a collection
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/ReactionDto'
      required:
        - id
        - url

    ReactionDto:
      properties:
        emoji:
          type: string
        count:
          type: integer
        reacted:
          type: boolean
          description: Whether the current user is one of them
        users:
          type: array
          description: Display names (else usernames) of everybody who reacted
          items:
            type: string
      required:
        - emoji
        - count
        - reacted
        - users

    SetReactionDto:
      properties:
        emoji:
          type: string
          description: One of 👍 ❤️ 😂 🔥 😮 🙏
        reacted:
          type: boolean
          description: True adds the reaction, false removes it
      required:
        - emoji
        - reacted

    TrashDto:
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/TrashedCollectionDto'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/TrashedBookmarkDto'
        retentionDays:
          type: integer
      required:
        - collections
        - bookmarks
        - retentionDays

    TrashedCollectionDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        parentName:
          type: string
        bookmarkCount:
          type: integer
          description: Links in it and below it
        childCount:
          type: integer
          description: Collections below it
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          type: string
      required:
        - id
        - name
        - bookmarkCount
        - childCount
        - deletedAt

    TrashedBookmarkDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        url:
          type: string
        title:
          type: string
        favicon:
          type: string
        collectionId:
          $ref: '#/components/schemas/ID'
        collectionName:
          type: string
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          type: string
      required:
        - id
        - url
        - collectionId
        - deletedAt

    TrashSelectionDto:
      properties:
        collectionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        bookmarkIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        all:
          type: boolean
          description: Everything in the trash the user may see (purge only)

    TagCountDto:
      properties:
        tag:
          type: string
        count:
          type: integer
      required:
        - tag
        - count

    CollectionShareDto:
      properties:
        shared:
          type: boolean
        token:
          type: string
          description: The secret part of the link /app/share/{token}; only set if shared
        createdAt:
          type: string
          format: date-time
        disabled:
          type: boolean
          description: Disabled by the administrators after a report; the collection cannot be shared again
        disabledReason:
          type: string
      required:
        - shared

    SharedCollectionDto:
      description: >
        What a public link shows: the collection, its links and its sub-collections. Nothing about the space, its
        members or private collections.
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        path:
          type: array
          description: From the shared collection down to this one (inclusive), for the breadcrumb
          items:
            $ref: '#/components/schemas/SharedCollectionRefDto'
        children:
          type: array
          items:
            $ref: '#/components/schemas/SharedCollectionRefDto'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/SharedBookmarkDto'
      required:
        - id
        - name
        - path
        - children
        - bookmarks

    SharedCollectionRefDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        bookmarkCount:
          type: integer
        childCount:
          type: integer
      required:
        - id
        - name
        - bookmarkCount
        - childCount

    SharedBookmarkDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        ogImage:
          type: string
          description: The preview image to show (an own address or the page's), unless customImageId is set
        customImageId:
          $ref: '#/components/schemas/ID'
        favicon:
          type: string
        createdAt:
          type: string
          format: date-time
        headlines:
          type: boolean
          description: The link has a news feed; its headlines come from getSharedHeadlines
      required:
        - id
        - url
        - tags

    CollectionNewsDto:
      properties:
        collectionId:
          $ref: '#/components/schemas/ID'
        count:
          type: integer
        addedBy:
          type: array
          description: Display names (else usernames) of the members who added them
          items:
            type: string
        latestAt:
          type: string
          format: date-time
      required:
        - collectionId
        - count
        - addedBy
        - latestAt

    SpaceBarDto:
      description: >
        The space bar from top to bottom. Spaces missing here are shown after these items; spaces the user is
        no longer a member of are dropped.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpaceBarItemDto'
      required:
        - items

    SpaceBarItemDto:
      description: Either a single space (spaceId) or a folder (folderId, name, spaceIds)
      properties:
        spaceId:
          $ref: '#/components/schemas/ID'
        folderId:
          type: string
        name:
          type: string
        spaceIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'

    DashboardSectionTypeEnum:
      type: string
      description: >
        LINKS holds hand-picked bookmarks in a custom order, FAVORITES and RECENT are filled automatically,
        HEADLINES merges the headlines of hand-picked links with a feed (all of the space's if none are picked)
      enum:
        - LINKS
        - FAVORITES
        - RECENT
        - HEADLINES

    DashboardDto:
      properties:
        customized:
          type: boolean
          description: False while the user still sees the default layout
        sections:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSectionDto'
      required:
        - customized
        - sections

    DashboardSectionDto:
      properties:
        id:
          type: string
          description: Empty for sections of the default layout
        title:
          type: string
        type:
          $ref: '#/components/schemas/DashboardSectionTypeEnum'
        bookmarks:
          type: array
          description: For HEADLINES the links whose feeds it shows
          items:
            $ref: '#/components/schemas/BookmarkDto'
        allFeeds:
          type: boolean
          description: A HEADLINES section without picked links, showing every link of the space with a feed
      required:
        - title
        - type
        - bookmarks

    UpdateDashboardDto:
      properties:
        sections:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/UpdateDashboardSectionDto'
      required:
        - sections

    UpdateDashboardSectionDto:
      properties:
        title:
          type: string
        type:
          $ref: '#/components/schemas/DashboardSectionTypeEnum'
        bookmarkIds:
          type: array
          description: Only used for LINKS (in display order) and HEADLINES sections (none = every link with a feed)
          items:
            $ref: '#/components/schemas/ID'
      required:
        - title
        - type

    FetchMetadataRequest:
      properties:
        url:
          type: string
      required:
        - url

    BookmarkMetadataDto:
      properties:
        url:
          type: string
          description: The normalized URL (e.g. with https:// added)
        found:
          type: boolean
          description: False if the page could not be loaded or had no usable metadata
        title:
          type: string
        description:
          type: string
        ogImage:
          type: string
        favicon:
          type: string
        canonical:
          type: string
        keywords:
          type: array
          items:
            type: string
        feedUrl:
          type: string
          description: The news feed the page links to, if any
      required:
        - url
        - found

    HeadlinesDto:
      properties:
        feedTitle:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/HeadlineDto'
        failed:
          type: boolean
          description: The feed (for several, every feed) could not be loaded
      required:
        - items
        - failed

    HeadlineDto:
      properties:
        title:
          type: string
        url:
          type: string
        publishedAt:
          type: string
          format: date-time
        bookmarkId:
          $ref: '#/components/schemas/ID'
          description: The link whose feed it comes from, when merging several
      required:
        - title
        - url

    BookmarkDtoList:
      type: array
      items:
        $ref: '#/components/schemas/BookmarkDto'

    CreateBookmarkDto:
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        feedUrl:
          type: string
          description: A news feed or a page linking to one (the server finds its feed); 400 if there is none
        feedFilter:
          type: string
      required:
        - url

    UpdateBookmarkDto:
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        collectionId:
          $ref: '#/components/schemas/ID'
          description: Moves the link to another collection of the same space
        customImageUrl:
          type: string
          description: An own preview image address (replaces an upload); an empty string removes it
        imageHidden:
          type: boolean
          description: Show no preview image at all
        feedUrl:
          type: string
          description: >
            A news feed or a page linking to one (the server finds its feed); an empty string removes it, left out
            it stays
        feedFilter:
          type: string
          description: Left out it stays, an empty string removes it
      required:
        - url

    InviteDto:
      type: object
      properties:
        token:
          type: string
        targetType:
          type: string
          enum: [ SPACE, COLLECTION ]
        targetId:
          type: string
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true
        usedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    CreateInviteRequest:
      type: object
      required:
        - targetType
        - targetId
      properties:
        targetType:
          type: string
          enum: [ SPACE, COLLECTION ]
        targetId:
          type: string
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: No Content
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
    TooManyRequests:
      description: Too many requests, try again after the Retry-After header's seconds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
