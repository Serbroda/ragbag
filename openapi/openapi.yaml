components:
  schemas:
    ID:
      type: string
      description: UUID
      example: "fa2b6a4a-5403-498c-9be8-c31d7d01a724"
      minLength: 36
      maxLength: 36

    JWT:
      type: string
      description: JSON Web Token
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdW..."

    Error:
      type: object
      properties:
        message:
          type: string

    FeatureFlags:
      type: object
      additionalProperties:
        type: string

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        access_token:
          $ref: '#/components/schemas/JWT'
      required:
        - access_token

    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
      required:
        - newPassword

    PasswordResetPreviewDto:
      type: object
      properties:
        valid:
          type: boolean
          description: False if the link is unknown, expired or already used
        username:
          type: string
      required:
        - valid

    PasswordResetDto:
      type: object
      properties:
        token:
          type: string
          description: Only returned once; the server keeps a hash
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt

    AdminUserDto:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        email:
          type: string
        avatarId:
          $ref: '#/components/schemas/ID'
        instanceAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        spaces:
          type: integer
          description: Number of spaces the user is a member of
      required:
        - id
        - username
        - email
        - instanceAdmin

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - username
        - email
        - password

    UserDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        email:
          type: string
        avatarId:
          $ref: '#/components/schemas/ID'
        instanceAdmin:
          type: boolean
          description: Listed in ADMIN_USERS, may manage all users of this installation
      required:
        - id
        - username
        - email

    SpaceDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        iconId:
          $ref: '#/components/schemas/ID'
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SpacePermissionEnum'
        discoverable:
          type: boolean
          description: Listed for every account of the instance, which can join without an invite
        joinRole:
          $ref: '#/components/schemas/JoinRoleEnum'
        newCount:
          type: integer
          description: Links other members added since the current user last looked; only set in the space list
      required:
        - id
        - name

    DiscoverableSpaceDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        iconId:
          $ref: '#/components/schemas/ID'
        memberCount:
          type: integer
        joinRole:
          $ref: '#/components/schemas/JoinRoleEnum'
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
      required:
        - id
        - name
        - memberCount
        - joinRole

    JoinRoleEnum:
      type: string
      description: Role of people joining a discoverable space
      enum:
        - CONTRIBUTOR
        - VIEWER

    CreateSpaceDto:
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
      required:
        - name

    SpaceMemberRoleEnum:
      type: string
      enum:
        - OWNER
        - ADMIN
        - CONTRIBUTOR
        - VIEWER

    InviteRoleEnum:
      type: string
      description: Roles that can be handed out via invite links
      enum:
        - ADMIN
        - CONTRIBUTOR
        - VIEWER

    SpaceMemberDto:
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        avatarId:
          $ref: '#/components/schemas/ID'
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
      required:
        - userId
        - username
        - role

    UpdateSpaceMemberDto:
      properties:
        role:
          $ref: '#/components/schemas/SpaceMemberRoleEnum'
      required:
        - role

    InvitePreviewDto:
      properties:
        targetType:
          type: string
          enum: [ SPACE, COLLECTION ]
        targetId:
          $ref: '#/components/schemas/ID'
        targetName:
          type: string
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        invitedBy:
          type: string
        valid:
          type: boolean
          description: False if the invite is expired or used up
        alreadyMember:
          type: boolean
      required:
        - targetType
        - targetId
        - valid
        - alreadyMember

    SpacePermissionEnum:
      type: string
      enum:
        - READ # Permission to read space details and collections
        - EDIT_SPACE # Permission to edit space details (name, description)
        - CREATE_COLLECTIONS # Permission to create collections within the space
        - EDIT_COLLECTIONS # Permission to create and manage collections within the space
        - DELETE_COLLECTIONS # Permission to delete collections within the space
        - CREATE_BOOKMARKS # Permission to create bookmarks within the space
        - EDIT_BOOKMARKS # Permission to create and manage bookmarks within the space
        - DELETE_BOOKMARKS # Permission to delete bookmarks within the space
        - DELETE_SPACE # Permission to delete the space
        - MANAGE_MEMBERS # Permission to change member roles, remove members and manage invites
        - IMPORT_EXPORT # Permission to export collections and import export files

    UpdateSpaceDto:
      properties:
        name:
          type: string
        description:
          type: string
        discoverable:
          type: boolean
          description: Unchanged when left out; changing it needs MANAGE_MEMBERS
        joinRole:
          $ref: '#/components/schemas/JoinRoleEnum'
      required:
        - name

    SpaceDtoList:
      type: array
      items:
        $ref: '#/components/schemas/SpaceDto'

    CollectionDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        parentId:
          $ref: '#/components/schemas/ID'
        restricted:
          type: boolean
          description: Only the members listed in the collection's access can see it (and everything inside)
        children:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDto'
        bookmarkCount:
          type: integer
          description: Links directly in this collection; only set in the collection tree
        newCount:
          type: integer
          description: Links directly in this collection that are new for the current user; only set in the tree
        shared:
          type: boolean
          description: Has a public read-only link
      required:
        - id
        - name

    CollectionVisibilityDto:
      type: string
      enum:
        - PRIVATE
        - INTERNAL
        - PUBLIC

    CollectionDtoList:
      type: array
      items:
        $ref: '#/components/schemas/CollectionDto'

    CreateCollectionDto:
      properties:
        name:
          type: string
        parentId:
          $ref: '#/components/schemas/ID'
        restricted:
          type: boolean
          description: Create the collection as private; the creator always has access
        memberIds:
          type: array
          description: Further space members who may see a private collection
          items:
            $ref: '#/components/schemas/ID'
      required:
        - name

    CollectionAccessDto:
      properties:
        restricted:
          type: boolean
        members:
          type: array
          description: Members who can see the collection (empty unless restricted)
          items:
            $ref: '#/components/schemas/CollectionAccessMemberDto'
        canManage:
          type: boolean
          description: Whether the current user may change who can see the collection
      required:
        - restricted
        - members
        - canManage

    CollectionAccessMemberDto:
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        avatarId:
          $ref: '#/components/schemas/ID'
      required:
        - userId
        - username

    UpdateCollectionAccessDto:
      properties:
        restricted:
          type: boolean
        memberIds:
          type: array
          description: Space members who may see the private collection; the current user is always kept
          items:
            $ref: '#/components/schemas/ID'
      required:
        - restricted

    ImportResultDto:
      description: What an import did, or as preview would do
      properties:
        preview:
          type: boolean
        formatVersion:
          type: integer
        appVersion:
          type: string
          description: Ragbag version that exported the file
        collectionsCreated:
          type: integer
        collectionsMerged:
          type: integer
          description: Sub-collections of the file that already existed under the same name
        bookmarksImported:
          type: integer
        bookmarksSkipped:
          type: integer
          description: Links already in the target collection
        bookmarksInvalid:
          type: integer
          description: Links without a valid http(s) URL
      required:
        - preview
        - formatVersion
        - collectionsCreated
        - collectionsMerged
        - bookmarksImported
        - bookmarksSkipped
        - bookmarksInvalid

    ImageUpload:
      type: object
      description: Either an image file (PNG, JPEG, GIF or WebP) or the URL of one
      properties:
        file:
          type: string
          format: binary
        url:
          type: string

    UpdateCollectionDto:
      properties:
        name:
          type: string
        description:
          type: string
          description: Omitted keeps the description, an empty string removes it
      required:
        - name

    MoveCollectionDto:
      type: object
      properties:
        parentId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: Target parent collection ID, or null to move to root

    BookmarkDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        collectionId:
          $ref: '#/components/schemas/ID'
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        ogImage:
          type: string
        favicon:
          type: string
        canonical:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Username of the member who added the bookmark
        favorite:
          type: boolean
          description: Whether the current user marked this bookmark as favorite
        isNew:
          type: boolean
          description: >
            Added by another member since the current user last looked at the collection; only set when listing
            a collection
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/ReactionDto'
      required:
        - id
        - url

    ReactionDto:
      properties:
        emoji:
          type: string
        count:
          type: integer
        reacted:
          type: boolean
          description: Whether the current user is one of them
        users:
          type: array
          description: Usernames of everybody who reacted
          items:
            type: string
      required:
        - emoji
        - count
        - reacted
        - users

    SetReactionDto:
      properties:
        emoji:
          type: string
          description: One of 👍 ❤️ 😂 🔥 😮 🙏
        reacted:
          type: boolean
          description: True adds the reaction, false removes it
      required:
        - emoji
        - reacted

    CollectionShareDto:
      properties:
        shared:
          type: boolean
        token:
          type: string
          description: The secret part of the link /app/share/{token}; only set if shared
        createdAt:
          type: string
          format: date-time
      required:
        - shared

    SharedCollectionDto:
      description: >
        What a public link shows: the collection, its links and its sub-collections. Nothing about the space, its
        members or private collections.
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        path:
          type: array
          description: From the shared collection down to this one (inclusive), for the breadcrumb
          items:
            $ref: '#/components/schemas/SharedCollectionRefDto'
        children:
          type: array
          items:
            $ref: '#/components/schemas/SharedCollectionRefDto'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/SharedBookmarkDto'
      required:
        - id
        - name
        - path
        - children
        - bookmarks

    SharedCollectionRefDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        bookmarkCount:
          type: integer
        childCount:
          type: integer
      required:
        - id
        - name
        - bookmarkCount
        - childCount

    SharedBookmarkDto:
      properties:
        id:
          $ref: '#/components/schemas/ID'
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        ogImage:
          type: string
        favicon:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - url
        - tags

    CollectionNewsDto:
      properties:
        collectionId:
          $ref: '#/components/schemas/ID'
        count:
          type: integer
        addedBy:
          type: array
          description: Usernames of the members who added them
          items:
            type: string
        latestAt:
          type: string
          format: date-time
      required:
        - collectionId
        - count
        - addedBy
        - latestAt

    SpaceBarDto:
      description: >
        The space bar from top to bottom. Spaces missing here are shown after these items; spaces the user is
        no longer a member of are dropped.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpaceBarItemDto'
      required:
        - items

    SpaceBarItemDto:
      description: Either a single space (spaceId) or a folder (folderId, name, spaceIds)
      properties:
        spaceId:
          $ref: '#/components/schemas/ID'
        folderId:
          type: string
        name:
          type: string
        spaceIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'

    DashboardSectionTypeEnum:
      type: string
      description: >
        LINKS holds hand-picked bookmarks in a custom order, FAVORITES and RECENT are filled automatically
      enum:
        - LINKS
        - FAVORITES
        - RECENT

    DashboardDto:
      properties:
        customized:
          type: boolean
          description: False while the user still sees the default layout
        sections:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSectionDto'
      required:
        - customized
        - sections

    DashboardSectionDto:
      properties:
        id:
          type: string
          description: Empty for sections of the default layout
        title:
          type: string
        type:
          $ref: '#/components/schemas/DashboardSectionTypeEnum'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/BookmarkDto'
      required:
        - title
        - type
        - bookmarks

    UpdateDashboardDto:
      properties:
        sections:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/UpdateDashboardSectionDto'
      required:
        - sections

    UpdateDashboardSectionDto:
      properties:
        title:
          type: string
        type:
          $ref: '#/components/schemas/DashboardSectionTypeEnum'
        bookmarkIds:
          type: array
          description: Only used for LINKS sections, in display order
          items:
            $ref: '#/components/schemas/ID'
      required:
        - title
        - type

    FetchMetadataRequest:
      properties:
        url:
          type: string
      required:
        - url

    BookmarkMetadataDto:
      properties:
        url:
          type: string
          description: The normalized URL (e.g. with https:// added)
        found:
          type: boolean
          description: False if the page could not be loaded or had no usable metadata
        title:
          type: string
        description:
          type: string
        ogImage:
          type: string
        favicon:
          type: string
        canonical:
          type: string
        keywords:
          type: array
          items:
            type: string
      required:
        - url
        - found

    BookmarkDtoList:
      type: array
      items:
        $ref: '#/components/schemas/BookmarkDto'

    CreateBookmarkDto:
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - url

    UpdateBookmarkDto:
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        collectionId:
          $ref: '#/components/schemas/ID'
          description: Moves the link to another collection of the same space
      required:
        - url

    InviteDto:
      type: object
      properties:
        token:
          type: string
        targetType:
          type: string
          enum: [ SPACE, COLLECTION ]
        targetId:
          type: string
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true
        usedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    CreateInviteRequest:
      type: object
      required:
        - targetType
        - targetId
      properties:
        targetType:
          type: string
          enum: [ SPACE, COLLECTION ]
        targetId:
          type: string
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: No Content
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
