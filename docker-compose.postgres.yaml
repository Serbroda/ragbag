# Ragbag with PostgreSQL. For a single-container setup with SQLite see docker-compose.yaml.
#
#   cp .env.example .env    # then change the secrets
#   docker compose -f docker-compose.postgres.yaml up -d --build
#
# Open http://localhost:8080, sign in as "admin" (or the first of ADMIN_USERS) with the password from
#   docker compose -f docker-compose.postgres.yaml exec app cat /data/initial-admin-password
# and start fresh or restore a backup of another Ragbag.
# Every setting of .env.example is passed on (except the paths and the port, fixed inside the container).
# Every value below has a dummy default so the stack starts out of the box. Do not use the
# defaults for anything reachable from the internet.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ragbag}
      POSTGRES_USER: ${DB_USER:-ragbag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ragbag-dummy-db-password}
    volumes:
      # Postgres 18 keeps its data below /var/lib/postgresql/<version>
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ragbag:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RAGBAG_PORT:-8080}:8080"
    # stdout logs (with IP addresses) do not grow forever
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # Files next to the database: the initial admin password, log files (LOG_FILE)
      - app-data:/data
    environment:
      # URL-encode special characters of the password (e.g. @ as %40)
      DATABASE_URL: postgres://${DB_USER:-ragbag}:${DB_PASSWORD:-ragbag-dummy-db-password}@db:5432/${DB_NAME:-ragbag}?sslmode=disable
      # At least 32 characters, e.g. `openssl rand -base64 32`
      JWT_SECRET: ${JWT_SECRET:-dummy-jwt-secret-change-me-0123456789abcdef}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_MINUTES: ${REFRESH_TOKEN_MINUTES:-20160}
      # The address Ragbag is reached at (links in emails), e.g. https://ragbag.example.com
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Legal pages elsewhere; otherwise Markdown files in /data/legal (templates in docs/legal)
      IMPRINT_URL: ${IMPRINT_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      TERMS_URL: ${TERMS_URL:-}
      # Usernames (comma-separated) that may manage all users, decide on reports and download backups.
      # The first start creates the first of them (or "admin") with a random password, see
      # docker compose -f docker-compose.postgres.yaml exec app cat /data/initial-admin-password
      ADMIN_USERS: ${ADMIN_USERS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # The refresh cookie is marked Secure automatically when Ragbag is reached via HTTPS, also behind a
      # reverse proxy like nginx proxy manager (it sends X-Forwarded-Proto). true forces it.
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      # Allow loading link titles from your own network (homelab dashboards)
      ALLOW_PRIVATE_HOSTS: ${ALLOW_PRIVATE_HOSTS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Email (optional, see .env.example)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      # Quotas (empty: unlimited)
      QUOTA_LINKS_PER_USER: ${QUOTA_LINKS_PER_USER:-}
      QUOTA_SPACES_PER_USER: ${QUOTA_SPACES_PER_USER:-}
      QUOTA_COLLECTIONS_PER_SPACE: ${QUOTA_COLLECTIONS_PER_SPACE:-}
      QUOTA_UPLOAD_MB_PER_USER: ${QUOTA_UPLOAD_MB_PER_USER:-}
      # Plans (off: everybody gets the quotas above): Free gets QUOTA_*, Pro QUOTA_PRO_* (empty: unlimited)
      PLANS_ENABLED: ${PLANS_ENABLED:-false}
      QUOTA_PRO_LINKS_PER_USER: ${QUOTA_PRO_LINKS_PER_USER:-}
      QUOTA_PRO_SPACES_PER_USER: ${QUOTA_PRO_SPACES_PER_USER:-}
      QUOTA_PRO_COLLECTIONS_PER_SPACE: ${QUOTA_PRO_COLLECTIONS_PER_SPACE:-}
      QUOTA_PRO_UPLOAD_MB_PER_USER: ${QUOTA_PRO_UPLOAD_MB_PER_USER:-}
      # A donation page linked next to the search, e.g. https://ko-fi.com/<name> (unlocks nothing)
      SUPPORT_URL: ${SUPPORT_URL:-}
      # Backups into /data/backups: the newest BACKUP_KEEP are kept, 0 is off
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Logs to stdout unless LOG_FILE is set (e.g. /data/logs/ragbag.log, deleted after LOG_MAX_AGE_DAYS)
      LOG_FILE: ${LOG_FILE:-}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-7}
      LOG_ANONYMIZE_IP: ${LOG_ANONYMIZE_IP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-10}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}

volumes:
  db-data:
  app-data:
