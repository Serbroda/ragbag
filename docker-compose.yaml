# Ragbag in a single container with SQLite, the simplest setup for personal use and homelabs.
# For PostgreSQL use docker-compose.postgres.yaml instead.
#
#   cp .env.example .env    # then change the secrets
#   docker compose up -d --build
#
# Open http://localhost:8080 and register the first account. The database lives in the
# ragbag-data volume (/data/ragbag.db inside the container).
# Every value below has a dummy default so the stack starts out of the box. Do not use the
# defaults for anything reachable from the internet.

services:
  app:
    build: .
    image: ragbag:latest
    restart: unless-stopped
    ports:
      - "${RAGBAG_PORT:-8080}:8080"
    # "Fetch details" and avatar URLs need DNS inside the container. If the log says "Cannot resolve host",
    # the host firewall probably blocks the container network's DNS (Podman + UFW: allow 10.88.0.0/15),
    # or bypass it with public resolvers:
    # dns:
    #   - 192.168.2.1
    #   - 9.9.9.9
    volumes:
      - ragbag-data:/data
      # Or keep the database next to this file; the container fixes the permissions on startup.
      # On SELinux hosts (Fedora, RHEL) append :Z, i.e. ./data:/data:Z
      # - ./data:/data
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlite:/data/ragbag.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000&date_class=TEXT"
      # At least 32 characters, e.g. `openssl rand -base64 32`
      JWT_SECRET: ${JWT_SECRET:-dummy-jwt-secret-change-me-0123456789abcdef}
      # The refresh cookie is marked Secure automatically when Ragbag is reached via HTTPS, also behind a
      # reverse proxy like nginx proxy manager (it sends X-Forwarded-Proto). true forces it.
      SECURITY_JWT_SECURECOOKIE: ${SECURE_COOKIE:-false}
      # Comma-separated keys for /actuator (header X-Api-Key). Without it /actuator stays closed.
      # Not passed by default: some podman-compose versions hand an empty ${VAR:-} default over literally.
      # ACTUATOR_API_KEYS: ${ACTUATOR_API_KEYS}
      # Usernames (comma-separated) that may manage all users, e.g. create password reset links:
      # Profile menu → Manage users. Set ADMIN_USERS in .env and uncomment.
      # ADMIN_USERS: ${ADMIN_USERS}
      APP_FEATURES_REGISTRATIONENABLED: ${REGISTRATION_ENABLED:-true}
      # Allow loading link titles from your own network (homelab dashboards)
      APP_METADATA_ALLOWPRIVATEHOSTS: ${ALLOW_PRIVATE_HOSTS:-false}

volumes:
  ragbag-data:
